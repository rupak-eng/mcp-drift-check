name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile scripts/public_census.py
      - run: PYTHONPATH=src python scripts/public_census.py --help >/dev/null
      - run: mcp-drift-check scan examples/safe-config.json
      - run: mcp-drift-check scan examples/mutable-config.json || test $? -eq 1
      - name: Orynval local CLI smoke test
        if: matrix.python-version == '3.11'
        run: |
          set +e
          orynval-security-check . --output /tmp/orynval-local.md
          code=$?
          set -e
          test "$code" -le 1
          grep -q "# Orynval Security Check" /tmp/orynval-local.md
          grep -q "orynval.com/security-triage" /tmp/orynval-local.md
      - name: Orynval public GitHub E2E scan
        if: matrix.python-version == '3.11'
        run: |
          set +e
          orynval-security-check tomelias10/mcp-drift-check --clone-timeout 60 --output /tmp/orynval-public.md
          code=$?
          set -e
          test "$code" -le 1
          grep -q 'Target: `tomelias10/mcp-drift-check`' /tmp/orynval-public.md
          grep -q "orynval.com/security-triage" /tmp/orynval-public.md
